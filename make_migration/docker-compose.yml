services:
    db:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: migr
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
        ports:
            - "15432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 2s
            timeout: 5s
            retries: 10
